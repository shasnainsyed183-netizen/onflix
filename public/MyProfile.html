<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - My Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#0a0a12;--bg2:#12121f;--bg3:#1a1a2a;--red:#e50914;--gold:#f5c518;--text:#fff;--text2:#8a8a9a;--border:#1e1e30}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:40px 20px}
        .profile-card{background:var(--bg2);border-radius:24px;padding:50px 40px;max-width:480px;width:100%;text-align:center;border:1px solid var(--border);box-shadow:0 40px 80px rgba(0,0,0,0.6);position:relative;overflow:hidden}
        .profile-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 20%,rgba(229,9,20,0.08),transparent 50%);pointer-events:none}
        .avatar-ring{width:130px;height:130px;border-radius:50%;border:4px solid var(--red);padding:4px;margin:0 auto 20px;position:relative}
        .avatar-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
        .avatar-placeholder{width:100%;height:100%;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:55px;font-weight:700;color:#fff}
        h1{font-size:1.8rem;font-weight:700;margin-bottom:4px}
        .email{color:var(--text2);font-size:13px;margin-bottom:12px}
        .badge{display:inline-block;background:var(--red);color:#fff;padding:5px 16px;border-radius:25px;font-size:11px;font-weight:600;margin-bottom:25px;letter-spacing:0.5px}
        .stats-row{display:flex;gap:10px;margin-bottom:25px}
        .stat-box{flex:1;background:var(--bg3);padding:18px 10px;border-radius:14px;border:1px solid var(--border)}
        .stat-box i{font-size:20px;color:var(--red);margin-bottom:6px;display:block}
        .stat-box .val{font-size:1.1rem;font-weight:700}.stat-box .lbl{color:var(--text2);font-size:10px;text-transform:uppercase;margin-top:3px}
        .info-list{text-align:left;margin-bottom:25px}
        .info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
        .info-row .key{color:var(--text2)}.info-row .val{font-weight:600}
        .btn{display:block;width:100%;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:none;text-decoration:none;text-align:center;transition:0.3s;margin-bottom:8px}
        .btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#ff0f1f;transform:translateY(-2px)}
        .btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:var(--bg3)}
        .btn-logout{background:transparent;color:#e74c3c;border:1px solid #e74c3c;margin-top:5px}
        .btn-logout:hover{background:#e74c3c;color:#fff}
        .loading{color:var(--text2);padding:40px}
        @media(max-width:400px){.profile-card{padding:30px 20px}}
    </style>
</head>
<body>
    <div class="profile-card" id="profileCard"><div class="loading">Loading...</div></div>
    <script>
        const token=localStorage.getItem('onflix_token'),user=JSON.parse(localStorage.getItem('onflix_user')||'{}');
        if(!token)window.location.href='/login-form';

        async function load(){
            try{
                const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+token}});
                const u=await r.json();
                const initial=(u.name||'U')[0].toUpperCase();
                document.getElementById('profileCard').innerHTML=`
                    <div class="avatar-ring">${u.avatar?`<img src="${u.avatar}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="avatar-placeholder" style="display:none">${initial}</div>`:`<div class="avatar-placeholder">${initial}</div>`}</div>
                    <h1>${u.name||'User'}</h1>
                    <p class="email"><i class="fas fa-envelope"></i> ${u.email}</p>
                    <span class="badge">${u.provider==='google'?'🔵 Google Account':'📧 Email Account'}</span>
                    <div class="stats-row">
                        <div class="stat-box"><i class="fas fa-calendar-check"></i><div class="val">${new Date(u.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div><div class="lbl">Joined</div></div>
                        <div class="stat-box"><i class="fas fa-clock"></i><div class="val">${new Date(u.lastLogin).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div><div class="lbl">Last Login</div></div>
                        <div class="stat-box"><i class="fas fa-shield-alt"></i><div class="val" style="color:#2ecc71">Active</div><div class="lbl">Status</div></div>
                    </div>
                    <div class="info-list">
                        <div class="info-row"><span class="key">Account ID</span><span class="val">${u.id?.slice(0,12)}...</span></div>
                        <div class="info-row"><span class="key">Provider</span><span class="val">${u.provider||'Email'}</span></div>
                        <div class="info-row"><span class="key">Email Verified</span><span class="val" style="color:#2ecc71">✅ Yes</span></div>
                        <div class="info-row"><span class="key">Plan</span><span class="val" style="color:var(--gold)">Free Member</span></div>
                    </div>
                    <a href="/browse" class="btn btn-red"><i class="fas fa-home"></i> Back to Home</a>
                    <a href="/admin" class="btn btn-outline"><i class="fas fa-cog"></i> Admin Panel</a>
                    <button class="btn btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>`;
            }catch(e){document.getElementById('profileCard').innerHTML='<p>Error loading</p><a href="/browse" class="btn btn-red" style="margin-top:15px">Back</a>';}
        }
        async function logout(){try{await fetch('/api/logout',{method:'POST',headers:{'Authorization':'Bearer '+token}})}catch(e){}localStorage.clear();window.location.href='/'}
        load();
    </script>
</body>
</html>
