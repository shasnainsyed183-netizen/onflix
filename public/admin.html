<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - Upload Movie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#000;--bg2:#111;--bg3:#1a1a1a;--red:#e50914;--text:#fff;--text2:#b3b3b3;--border:#333}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        
        /* Background gradient */
        body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at top,rgba(229,9,20,0.1),transparent 60%),radial-gradient(ellipse at bottom,rgba(0,0,0,0.8),transparent);z-index:-1}

        .upload-container{background:var(--bg2);padding:40px;border-radius:10px;max-width:650px;width:100%;border:1px solid var(--border);box-shadow:0 30px 60px rgba(0,0,0,0.7)}
        
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
        .header h1{font-size:28px;font-weight:700;color:var(--text)}
        .header h1 i{color:var(--red);margin-right:10px}
        .header .nav-btns{display:flex;gap:10px}
        .btn-sm{padding:8px 16px;border-radius:5px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:0.3s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
        .btn-outline-sm{background:transparent;color:var(--text2);border:1px solid var(--border)}
        .btn-outline-sm:hover{background:var(--bg3);color:var(--text)}
        .btn-danger-sm{background:transparent;color:#e74c3c;border:1px solid #e74c3c}
        .btn-danger-sm:hover{background:#e74c3c;color:#fff}

        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
        .form-group{margin-bottom:16px}
        .form-group.full{grid-column:1/-1}
        label{display:block;margin-bottom:6px;font-weight:600;color:var(--text2);font-size:13px;text-transform:uppercase;letter-spacing:0.5px}
        input,textarea,select{width:100%;padding:14px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:15px;transition:0.3s;font-family:'Helvetica Neue',Arial,sans-serif}
        input:focus,textarea:focus,select:focus{border-color:var(--red);outline:none;background:#222}
        textarea{height:90px;resize:vertical}
        select{appearance:none;cursor:pointer}
        select option{background:var(--bg3);color:var(--text)}
        
        .file-upload{border:2px dashed var(--border);padding:25px;text-align:center;border-radius:5px;cursor:pointer;transition:0.3s;background:var(--bg3)}
        .file-upload:hover{border-color:var(--red);background:#1a1a1a}
        .file-upload i{font-size:40px;color:var(--red);margin-bottom:10px;display:block}
        .file-upload p{color:var(--text2);font-size:13px}
        .file-upload input{display:none}

        .btn-submit{width:100%;padding:16px;background:var(--red);color:#fff;border:none;border-radius:5px;font-size:18px;font-weight:700;cursor:pointer;transition:0.3s;margin-top:10px;text-transform:uppercase;letter-spacing:1px}
        .btn-submit:hover{background:#ff0f1f;transform:scale(1.01);box-shadow:0 10px 30px rgba(229,9,20,0.4)}
        .btn-submit:disabled{opacity:0.5;cursor:not-allowed}

        .msg{padding:14px;border-radius:5px;margin-top:15px;display:none;font-weight:600;text-align:center}
        .msg.info{background:#3498db;color:#fff;display:block}
        .msg.success{background:#2ecc71;color:#fff;display:block}
        .msg.error{background:#e74c3c;color:#fff;display:block}

        .back-link{text-align:center;margin-top:20px}
        .back-link a{color:var(--text2);text-decoration:none;font-size:13px;transition:0.3s}
        .back-link a:hover{color:var(--text)}

        .or-divider{text-align:center;color:var(--text2);font-size:13px;margin:10px 0;position:relative}
        .or-divider::before,.or-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border)}
        .or-divider::before{left:0}.or-divider::after{right:0}

        @media(max-width:768px){
            .form-grid{grid-template-columns:1fr}
            .upload-container{padding:25px}
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-cloud-upload-alt"></i> Upload Movie</h1>
            <div class="nav-btns">
                <a href="/" class="btn-sm btn-outline-sm"><i class="fas fa-home"></i> Home</a>
                <button class="btn-sm btn-danger-sm" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <!-- Form -->
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-grid">
                <!-- Title -->
                <div class="form-group full">
                    <label>📌 Movie Title *</label>
                    <input type="text" name="title" required placeholder="Enter movie title...">
                </div>

                <!-- Description -->
                <div class="form-group full">
                    <label>📝 Description</label>
                    <textarea name="description" placeholder="About the movie..."></textarea>
                </div>

                <!-- Genre -->
                <div class="form-group">
                    <label>🎭 Genre</label>
                    <select name="genre">
                        <option>Action</option><option>Comedy</option><option>Drama</option>
                        <option>Horror</option><option>Romance</option><option>Thriller</option>
                        <option>Sci-Fi</option><option>Pakistani Drama</option><option>Turkish Drama</option>
                        <option>Hollywood</option><option>Bollywood</option><option>Other</option>
                    </select>
                </div>

                <!-- Year -->
                <div class="form-group">
                    <label>📅 Year</label>
                    <input type="number" name="year" value="2025" placeholder="2025">
                </div>

                <!-- Duration -->
                <div class="form-group">
                    <label>⏱️ Duration</label>
                    <input type="text" name="duration" placeholder="2h 15min">
                </div>

                <!-- Director -->
                <div class="form-group">
                    <label>🎬 Director</label>
                    <input type="text" name="director" placeholder="Director name">
                </div>

                <!-- Cast -->
                <div class="form-group full">
                    <label>👥 Cast</label>
                    <input type="text" name="cast" placeholder="Actor 1, Actor 2, Actor 3">
                </div>

                <!-- Movie File -->
                <div class="form-group full">
                    <label>🎥 Movie File (MP4/MKV) - Choti Files Ke Liye</label>
                    <div class="file-upload" onclick="document.getElementById('videoFile').click()">
                        <i class="fas fa-video"></i>
                        <p id="videoLabel">Click to choose video file</p>
                        <input type="file" id="videoFile" name="video" accept="video/*" onchange="document.getElementById('videoLabel').textContent=this.files[0]?.name||'Click to choose video file'">
                    </div>
                </div>

                <!-- OR Divider -->
                <div class="form-group full">
                    <div class="or-divider">OR</div>
                </div>

                <!-- YouTube Link -->
                <div class="form-group full">
                    <label>🔗 YouTube Link - Badi Files Ke Liye</label>
                    <input type="text" name="youtubeLink" placeholder="https://youtu.be/xxxxx or https://youtube.com/watch?v=xxxxx">
                </div>

                <!-- Poster Image -->
                <div class="form-group full">
                    <label>🖼️ Poster Image (Optional)</label>
                    <div class="file-upload" onclick="document.getElementById('posterFile').click()">
                        <i class="fas fa-image"></i>
                        <p id="posterLabel">Click to choose poster image</p>
                        <input type="file" id="posterFile" name="poster" accept="image/*" onchange="document.getElementById('posterLabel').textContent=this.files[0]?.name||'Click to choose poster image'">
                    </div>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-rocket"></i> Upload Movie Now
            </button>
        </form>

        <!-- Message -->
        <div class="msg" id="msg"></div>

        <!-- Back Link -->
        <div class="back-link">
            <a href="/"><i class="fas fa-arrow-left"></i> Back to ONflix</a>
        </div>
    </div>

    <script>
        const API = location.origin;

        function logout() {
            localStorage.removeItem('onflix_admin_verified');
            localStorage.removeItem('admin_password');
            alert('✅ Logged out successfully!');
            window.location.href = '/';
        }

        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg ' + type;
            msg.style.display = 'block';
        }

        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const submitBtn = document.getElementById('submitBtn');
            
            // Check: ya to file hai ya YouTube link
            const videoFile = document.getElementById('videoFile').files[0];
            const youtubeLink = formData.get('youtubeLink')?.trim();
            
            if (!videoFile && !youtubeLink) {
                showMsg('❌ Please choose a video file OR enter a YouTube link!', 'error');
                return;
            }
            
            // Show uploading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            showMsg('⏳ Uploading... Please wait...', 'info');
            
            try {
                const res = await fetch(`${API}/api/movies`, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'x-device-key': 'onflix_admin_device_verified'
                    }
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showMsg('✅ Movie uploaded successfully! Redirecting to home...', 'success');
                    this.reset();
                    document.getElementById('videoLabel').textContent = 'Click to choose video file';
                    document.getElementById('posterLabel').textContent = 'Click to choose poster image';
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    throw new Error(data.error || 'Upload failed');
                }
            } catch(err) {
                showMsg('❌ Error: ' + err.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-rocket"></i> Upload Movie Now';
            }
        });
    </script>
</body>
</html>
