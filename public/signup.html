<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#000;--bg2:#111;--red:#e50914;--text:#fff;--text2:#b3b3b3;--border:#333}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
        body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(229,9,20,0.1),transparent 70%);z-index:-1}
        .box{background:rgba(0,0,0,0.85);padding:50px 40px;border-radius:10px;max-width:420px;width:100%;border:1px solid var(--border)}
        .logo{font-size:2rem;font-weight:900;color:var(--red);text-align:center;margin-bottom:30px}
        h2{font-size:1.8rem;margin-bottom:25px;text-align:center}
        input{width:100%;padding:15px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:16px;outline:none;margin-bottom:15px}
        input:focus{border-color:var(--red)}
        .btn{width:100%;padding:15px;background:var(--red);color:#fff;border:none;border-radius:5px;font-size:17px;font-weight:700;cursor:pointer}
        .btn:hover{background:#ff0f1f}
        .msg{padding:12px;border-radius:5px;margin-bottom:15px;display:none;text-align:center;font-weight:600}
        .msg.e{background:#e74c3c}.msg.s{background:#2ecc71}
        .link{text-align:center;margin-top:20px;color:var(--text2);font-size:14px}
        .link a{color:var(--text);text-decoration:none;font-weight:600}
        .back{text-align:center;margin-top:15px;font-size:13px}
        .back a{color:var(--text2);text-decoration:none}
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">ONflix</div>
        <h2>Create Account</h2>
        <div class="msg" id="msg"></div>
        <form id="f">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password (min 6 chars)" minlength="6" required>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <div class="link">Already have an account? <a href="/login">Sign in</a></div>
        <div class="back"><a href="/">← Back to Home</a></div>
    </div>
    <script>
        document.getElementById('f').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const fd=new FormData(e.target);
            const data={name:fd.get('name'),email:fd.get('email'),password:fd.get('password')};
            const msg=document.getElementById('msg');
            try{
                const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
                const d=await r.json();
                if(d.success){localStorage.setItem('onflix_token',d.token);localStorage.setItem('onflix_user',JSON.stringify(d.user));msg.className='msg s';msg.textContent='✅ Account created!';msg.style.display='block';setTimeout(()=>location.href='/',1500)}
                else{msg.className='msg e';msg.textContent='❌ '+d.error;msg.style.display='block'}
            }catch(e){msg.className='msg e';msg.textContent='❌ Error!';msg.style.display='block'}
        });
    </script>
</body>
</html>
