<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#000;--bg2:#111;--red:#e50914;--text:#fff;--text2:#b3b3b3;--border:#333}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
        .box{background:rgba(0,0,0,0.85);padding:50px 40px;border-radius:10px;max-width:420px;width:90%;border:1px solid var(--border);text-align:center}
        .logo{font-size:2rem;font-weight:900;color:var(--red);margin-bottom:20px}
        h1{font-size:1.6rem;margin-bottom:15px}
        p{color:var(--text2);font-size:14px;margin-bottom:20px}
        input{width:100%;padding:14px;border-radius:5px;border:1px solid var(--border);background:rgba(0,0,0,0.5);color:#fff;font-size:15px;outline:none;margin-bottom:12px}
        input:focus{border-color:var(--red)}
        .btn{width:100%;padding:14px;background:var(--red);color:#fff;border:none;border-radius:5px;font-size:16px;font-weight:700;cursor:pointer}
        .btn:hover{background:#ff0f1f}
        .msg{padding:12px;border-radius:5px;margin-bottom:15px;display:none;font-weight:600}
        .msg.e{background:#e74c3c}.msg.s{background:#2ecc71}
        .link{margin-top:20px;color:var(--text2);font-size:14px}
        .link a{color:var(--text);text-decoration:none;font-weight:600}
        .link a:hover{color:var(--red)}
        .hint{font-size:11px;color:var(--text2);margin-top:-8px;margin-bottom:12px}
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">ONflix</div>
        <h1>Create Account</h1>
        <p>Enter your details to start watching.</p>
        <div class="msg" id="msg"></div>
        <form id="signupForm">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email address" required>
            <input type="password" name="password" placeholder="Create password" minlength="6" required>
            <p class="hint">🔒 Password must be at least 6 characters</p>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <div class="link">Already have an account? <a href="/login-form">Sign in</a></div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit',async function(e){
            e.preventDefault();
            const fd=new FormData(this);
            const data={name:fd.get('name'),email:fd.get('email'),password:fd.get('password')};
            const msg=document.getElementById('msg');
            if(data.password.length<6){msg.className='msg e';msg.textContent='❌ Password must be at least 6 characters';msg.style.display='block';return}
            try{
                const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
                const d=await r.json();
                if(d.success){localStorage.setItem('onflix_token',d.token);localStorage.setItem('onflix_user',JSON.stringify(d.user));msg.className='msg s';msg.textContent='✅ Account created! Redirecting...';msg.style.display='block';setTimeout(()=>window.location.href='/browse',1500)}
                else{msg.className='msg e';msg.textContent='❌ '+d.error;msg.style.display='block'}
            }catch(e){msg.className='msg e';msg.textContent='❌ Connection error!';msg.style.display='block'}
        });
    </script>
</body>
</html>
