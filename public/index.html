<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - Watch Movies</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0a0f;color:#fff;min-height:100vh}
        .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:15px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px)}
        .logo{font-size:2rem;font-weight:900;color:#e50914;text-decoration:none}
        .logo span{color:#fff;font-weight:300}
        .search-box{display:flex;align-items:center;background:rgba(255,255,255,0.1);border-radius:30px;padding:8px 18px}
        .search-box input{background:none;border:none;color:#fff;padding:8px;outline:none;width:200px}
        .search-box button{background:#e50914;border:none;color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:600}
        .upload-btn{background:#e50914;color:#fff;padding:10px 22px;border-radius:25px;text-decoration:none;font-weight:700;font-size:14px}
        .hero{height:90vh;background:linear-gradient(135deg,#0a0a15,#1a1a2e,#0d0d1a);display:flex;align-items:center;justify-content:center;text-align:center}
        .hero h1{font-size:4rem;font-weight:900;margin-bottom:15px}
        .hero h1 span{color:#e50914}
        .hero p{font-size:1.2rem;color:#aaa;margin-bottom:30px}
        .btn{display:inline-block;padding:14px 30px;border-radius:30px;font-weight:700;text-decoration:none;margin:5px;transition:0.3s}
        .btn-red{background:#e50914;color:#fff}
        .btn-outline{background:rgba(255,255,255,0.1);color:#fff;border:2px solid rgba(255,255,255,0.3)}
        .container{max-width:1400px;margin:0 auto;padding:30px}
        .section-title{font-size:1.8rem;margin-bottom:25px}
        .movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
        .movie-card{background:#1a1a2e;border-radius:12px;overflow:hidden;cursor:pointer;transition:0.3s;position:relative}
        .movie-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(229,9,20,0.3);border:1px solid #e50914}
        .movie-poster{width:100%;height:300px;object-fit:cover;background:#1a1a2e}
        .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:50px;opacity:0;transition:0.3s}
        .movie-card:hover .play-icon{opacity:1}
        .movie-info{padding:14px}
        .movie-title{font-weight:700;font-size:14px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .movie-meta{display:flex;justify-content:space-between;font-size:12px;color:#aaa}
        .movie-genre{display:inline-block;background:#e50914;padding:3px 10px;border-radius:15px;font-size:11px;margin-top:8px}
        .no-movies{grid-column:1/-1;text-align:center;padding:80px;color:#aaa}
        footer{text-align:center;padding:40px;color:#555;border-top:1px solid #1a1a2e}
        @media(max-width:768px){.hero h1{font-size:2.5rem}.movie-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">ON<span>flix</span></a>
        <div style="display:flex;gap:15px;align-items:center">
            <div class="search-box">
                <input id="s" placeholder="Search..." onkeypress="if(event.key==='Enter')search()">
                <button onclick="search()"><i class="fas fa-search"></i></button>
            </div>
            <a href="/admin" class="upload-btn">+ Upload</a>
        </div>
    </nav>
    <section class="hero">
        <div>
            <h1>Welcome to <span>ONflix</span></h1>
            <p>Watch unlimited movies anytime, anywhere.</p>
            <a href="#movies" class="btn btn-red" onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})"><i class="fas fa-play"></i> Browse</a>
            <a href="/admin" class="btn btn-outline"><i class="fas fa-upload"></i> Upload</a>
        </div>
    </section>
    <div class="container" id="movies">
        <h2 class="section-title"><i class="fas fa-fire" style="color:#e50914"></i> Latest Movies</h2>
        <div class="movie-grid" id="g"><div class="no-movies"><h3>Loading...</h3></div></div>
    </div>
    <footer><p>© 2024 ONflix</p></footer>
    <script>
        const A=location.origin;
        async function load(){
            try{
                const r=await fetch(A+'/api/movies');
                const m=await r.json();
                const g=document.getElementById('g');
                if(!m.length){g.innerHTML='<div class="no-movies"><h2>No Movies Yet</h2><p><a href="/admin" style="color:#e50914">Upload first movie</a></p></div>';return}
                g.innerHTML=m.map(v=>`<div class="movie-card" onclick="location.href='/watch/${v.id}'"><img class="movie-poster" src="${v.posterUrl||'https://via.placeholder.com/200x300/1a1a2e/e50914?text=No+Poster'}" alt="${v.title}"><div class="play-icon"><i class="fas fa-play-circle"></i></div><div class="movie-info"><div class="movie-title">${v.title}</div><div class="movie-meta"><span>📅 ${v.year}</span><span>👁 ${v.views||0}</span></div><span class="movie-genre">${v.genre}</span></div></div>`).join('')
            }catch(e){document.getElementById('g').innerHTML='<div class="no-movies"><h2>Error</h2><p>Run: node server.js</p></div>'}
        }
        async function search(){
            const q=document.getElementById('s').value.trim();
            if(!q)return;
            const r=await fetch(`${A}/api/search?q=${q}`);
            const m=await r.json();
            const g=document.getElementById('g');
            g.innerHTML=m.length?m.map(v=>`<div class="movie-card" onclick="location.href='/watch/${v.id}'"><img class="movie-poster" src="${v.posterUrl||'https://via.placeholder.com/200x300/1a1a2e/e50914?text=No+Poster'}" alt="${v.title}"><div class="play-icon"><i class="fas fa-play-circle"></i></div><div class="movie-info"><div class="movie-title">${v.title}</div><div class="movie-meta"><span>📅 ${v.year}</span><span>👁 ${v.views||0}</span></div><span class="movie-genre">${v.genre}</span></div></div>`).join(''):'<div class="no-movies"><h2>No results</h2></div>'
        }
        load();
    </script>
</body>
</html>
