<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="R-idmykRomJXEJS349CsX5q5nr-xPvKCJN91nqb5z7E" />
    <title>ONflix - Unlimited Movies & Dramas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#0a0a0f;--bg2:#12121a;--red:#e50914;--gold:#f5c518;--text:#fff;--text2:#aaa;--border:#222}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        
        .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
        .logo{font-size:1.6rem;font-weight:900;color:var(--red);text-decoration:none;letter-spacing:-1px}
        .nav-right{display:flex;align-items:center;gap:12px}
        .search-box{display:flex;align-items:center;background:rgba(255,255,255,0.08);border-radius:25px;padding:5px 5px 5px 14px;border:1px solid var(--border)}
        .search-box input{background:none;border:none;color:#fff;padding:8px;outline:none;width:150px;font-size:13px}
        .search-box button{background:var(--red);border:none;color:#fff;padding:8px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600}
        .nav-btn{background:var(--red);color:#fff;padding:7px 15px;border-radius:5px;text-decoration:none;font-weight:600;font-size:12px;border:none;cursor:pointer}
        .nav-btn.outline{background:transparent;border:1px solid #555;color:#ccc}
        .upload-btn{display:none;background:var(--red);color:#fff;padding:7px 15px;border-radius:5px;text-decoration:none;font-weight:600;font-size:12px}
        .upload-btn.show{display:inline-block}
        .user-name{color:#ccc;font-size:12px}
        
        .hero{background:linear-gradient(135deg,#0a0a15,#1a1a2e);padding:80px 20px 40px;text-align:center;border-bottom:2px solid var(--red)}
        .hero h1{font-size:2rem;font-weight:800;margin-bottom:8px}
        .hero h1 span{color:var(--red)}
        .hero p{color:var(--text2);font-size:14px;margin-bottom:15px}
        .btn{display:inline-block;padding:10px 24px;border-radius:5px;font-weight:700;text-decoration:none;margin:5px;font-size:14px;transition:0.3s}
        .btn-red{background:var(--red);color:#fff}
        .btn-outline{background:transparent;color:#fff;border:1px solid #555}
        
        .container{max-width:1200px;margin:0 auto;padding:20px 15px}
        .section-title{font-size:1.2rem;font-weight:700;margin-bottom:15px;display:flex;align-items:center;gap:8px;color:var(--text)}
        .section-title i{color:var(--red)}
        
        /* GRID LAYOUT */
        .movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
        
        .movie-card{background:var(--bg2);border-radius:8px;overflow:hidden;cursor:pointer;transition:0.3s;border:1px solid var(--border)}
        .movie-card:hover{transform:translateY(-5px);border-color:var(--red);box-shadow:0 10px 25px rgba(229,9,20,0.2)}
        .movie-poster{width:100%;height:210px;object-fit:cover;background:#1a1a2e}
        .movie-info{padding:10px 12px}
        .movie-title{font-weight:600;font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
        .movie-year{font-size:11px;color:var(--gold);margin-bottom:4px}
        .movie-genre{display:inline-block;background:var(--red);color:#fff;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600}
        .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;color:#fff;opacity:0;transition:0.3s}
        .movie-card:hover .play-icon{opacity:1}
        
        .no-movies{grid-column:1/-1;text-align:center;padding:50px;color:var(--text2)}
        .no-movies i{font-size:50px;color:var(--red);margin-bottom:10px}
        
        footer{text-align:center;padding:25px;color:#555;font-size:12px;border-top:1px solid var(--border);margin-top:20px}
        
        @media(min-width:768px){
            .movie-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
            .movie-poster{height:240px}
            .hero h1{font-size:2.8rem}
            .search-box input{width:200px}
        }
        @media(min-width:1024px){
            .movie-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
            .movie-poster{height:260px}
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="logo">ONflix</a>
        <div class="nav-right">
            <div class="search-box">
                <input type="text" id="s" placeholder="Search..." onkeypress="if(event.key==='Enter')searchMovies()">
                <button onclick="searchMovies()"><i class="fas fa-search"></i></button>
            </div>
            <a href="/admin" class="upload-btn" id="adminBtn">+ Upload</a>
            <span class="user-name" id="userName"></span>
            <a href="#" class="nav-btn outline" id="logoutBtn" onclick="logout()" style="display:none;">Logout</a>
            <a href="/login" class="nav-btn" id="loginBtn">Sign In</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Welcome to <span>ONflix</span></h1>
        <p>Watch unlimited movies & dramas anytime, anywhere. Free forever!</p>
        <a href="#movies" class="btn btn-red" onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})"><i class="fas fa-play"></i> Browse</a>
        <a href="/admin" class="btn btn-outline" id="heroAdminBtn"><i class="fas fa-upload"></i> Upload</a>
    </section>

    <div class="container" id="movies">
        <h2 class="section-title"><i class="fas fa-fire"></i> Trending Now</h2>
        <div class="movie-grid" id="movieGrid">
            <div class="no-movies"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
        </div>
    </div>

    <footer>© 2025 ONflix - Pakistan | Made with ❤️</footer>

    <script>
        const API = location.origin;
        let allMovies = [];
        const token = localStorage.getItem('onflix_token');
        const user = JSON.parse(localStorage.getItem('onflix_user') || '{}');

        if (!token) {
            document.getElementById('loginBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
        } else {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('userName').textContent = '👤 ' + (user.name || 'User');
        }

        function logout() {
            localStorage.removeItem('onflix_token');
            localStorage.removeItem('onflix_user');
            localStorage.removeItem('onflix_admin_verified');
            window.location.href = '/login';
        }

        const origFetch = fetch;
        fetch = function(url, options = {}) {
            if (token) { options.headers = options.headers || {}; options.headers['Authorization'] = 'Bearer ' + token; }
            return origFetch(url, options);
        };

        function checkAdmin() {
            const v = localStorage.getItem('onflix_admin_verified') === 'true';
            document.getElementById('adminBtn').classList.toggle('show', v);
            document.getElementById('heroAdminBtn').style.display = v ? 'inline-block' : 'none';
        }

        function movieCard(m) {
            const p = m.posterUrl || 'https://via.placeholder.com/180x260/1a1a2e/e50914?text=ONflix';
            const link = m.youtubeLink ? `window.open('${m.youtubeLink}')` : `location.href='/watch/${m.id}'`;
            return `<div class="movie-card" onclick="${link}" style="position:relative">
                <img class="movie-poster" src="${p}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/180x260/1a1a2e/e50914?text=ONflix'">
                <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                <div class="movie-info">
                    <div class="movie-title">${m.title}</div>
                    <div class="movie-year">📅 ${m.year}</div>
                    <span class="movie-genre">${m.genre}</span>
                </div>
            </div>`;
        }

        async function loadMovies() {
            const g = document.getElementById('movieGrid');
            if (!token) { g.innerHTML = '<div class="no-movies"><i class="fas fa-lock"></i><p>Please <a href="/login" style="color:var(--red)">Sign In</a></p></div>'; return; }
            try {
                const r = await fetch(`${API}/api/movies`);
                allMovies = await r.json();
                if (!allMovies.length) { g.innerHTML = '<div class="no-movies"><i class="fas fa-film"></i><p>No Movies Yet</p></div>'; return; }
                g.innerHTML = allMovies.map(movieCard).join('');
            } catch(e) { g.innerHTML = '<div class="no-movies"><i class="fas fa-exclamation-triangle"></i><p>Please login</p></div>'; }
        }

        async function searchMovies() {
            const q = document.getElementById('s').value.trim();
            if (!q) { loadMovies(); return; }
            const g = document.getElementById('movieGrid');
            try {
                const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
                const m = await r.json();
                g.innerHTML = m.length ? m.map(movieCard).join('') : '<div class="no-movies"><i class="fas fa-search"></i><p>No results</p></div>';
            } catch(e) {}
        }

        checkAdmin();
        loadMovies();
    </script>
</body>
</html>
