<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="R-idmykRomJXEJS349CsX5q5nr-xPvKCJN91nqb5z7E" />
    <title>ONflix - Watch Free Movies Online</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#0a0a0f;--bg2:#1a1a2e;--red:#e50914;--gold:#f5c518;--text:#fff;--text2:#aaa}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:15px 40px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.97);backdrop-filter:blur(20px);box-shadow:0 2px 20px rgba(0,0,0,0.5)}
        .logo{font-size:2rem;font-weight:900;color:var(--red);text-decoration:none;letter-spacing:-1px}
        .logo span{color:var(--text);font-weight:300}
        .search-box{display:flex;align-items:center;background:rgba(255,255,255,0.1);border-radius:30px;padding:6px 6px 6px 18px;border:1px solid rgba(255,255,255,0.2);transition:0.3s}
        .search-box:focus-within{border-color:var(--red);box-shadow:0 0 15px rgba(229,9,20,0.3)}
        .search-box input{background:none;border:none;color:#fff;padding:10px;outline:none;width:220px;font-size:14px}
        .search-box button{background:var(--red);border:none;color:#fff;padding:10px 18px;border-radius:25px;cursor:pointer;font-weight:600;transition:0.3s}
        .search-box button:hover{background:#ff0f1f}
        .upload-btn{background:var(--red);color:#fff;padding:10px 22px;border-radius:25px;text-decoration:none;font-weight:700;font-size:14px;display:none;transition:0.3s}
        .upload-btn.show{display:inline-block}
        .upload-btn:hover{background:#ff0f1f;transform:scale(1.05)}
        .hero{height:80vh;background:linear-gradient(135deg,#0a0a15 0%,#1a1a2e 50%,#0d0d1a 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
        .hero h1{font-size:3.5rem;font-weight:900;margin-bottom:15px;animation:fadeIn 1s}
        .hero h1 span{color:var(--red)}
        .hero p{font-size:1.2rem;color:var(--text2);margin-bottom:30px}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .btn{display:inline-block;padding:14px 32px;border-radius:30px;font-weight:700;text-decoration:none;margin:8px;transition:0.3s;font-size:16px}
        .btn-red{background:var(--red);color:#fff}
        .btn-red:hover{background:#ff0f1f;transform:scale(1.05);box-shadow:0 10px 30px rgba(229,9,20,0.4)}
        .btn-outline{background:rgba(255,255,255,0.08);color:#fff;border:2px solid rgba(255,255,255,0.3)}
        .btn-outline:hover{background:#fff;color:#000}
        .container{max-width:1400px;margin:0 auto;padding:30px 20px}
        .section-title{font-size:1.8rem;font-weight:700;margin-bottom:25px;display:flex;align-items:center;gap:10px}
        .movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
        .movie-card{background:var(--bg2);border-radius:14px;overflow:hidden;cursor:pointer;transition:0.35s;position:relative;border:1px solid #2a2a35}
        .movie-card:hover{transform:translateY(-10px);box-shadow:0 25px 50px rgba(229,9,20,0.25);border-color:var(--red)}
        .movie-poster{width:100%;height:330px;object-fit:cover;background:var(--bg2)}
        .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:55px;color:#fff;opacity:0;transition:0.3s;text-shadow:0 0 20px rgba(0,0,0,0.5)}
        .movie-card:hover .play-icon{opacity:1}
        .movie-info{padding:16px}
        .movie-title{font-weight:700;font-size:15px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .movie-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
        .movie-genre{display:inline-block;background:var(--red);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-top:8px}
        .movie-views{color:var(--gold)}
        .no-movies{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text2)}
        .no-movies i{font-size:70px;color:var(--red);display:block;margin-bottom:20px}
        .no-movies h3{font-size:1.5rem;margin-bottom:10px}
        footer{text-align:center;padding:30px;color:#555;border-top:1px solid #1a1a2e;font-size:13px}
        .movie-count{color:var(--text2);font-size:14px;font-weight:400}
        @media(max-width:768px){
            .navbar{padding:12px 15px}
            .search-box input{width:120px}
            .hero h1{font-size:2.2rem}
            .hero p{font-size:1rem}
            .movie-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
            .movie-poster{height:240px}
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">ON<span>flix</span></a>
        <div style="display:flex;gap:15px;align-items:center">
            <div class="search-box">
                <input type="text" id="s" placeholder="Search movies..." onkeypress="if(event.key==='Enter')searchMovies()">
                <button onclick="searchMovies()"><i class="fas fa-search"></i> Search</button>
            </div>
            <a href="/admin" class="upload-btn" id="adminBtn"><i class="fas fa-upload"></i> Upload</a>
        </div>
    </nav>

    <section class="hero">
        <div>
            <h1>Welcome to <span>ONflix</span></h1>
            <p>🎬 Watch unlimited movies & dramas anytime, anywhere. Free forever!</p>
            <a href="#movies" class="btn btn-red" onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})"><i class="fas fa-play"></i> Browse Movies</a>
            <a href="/admin" class="btn btn-outline" id="heroAdminBtn"><i class="fas fa-cloud-upload-alt"></i> Upload Movie</a>
        </div>
    </section>

    <div class="container" id="movies">
        <h2 class="section-title">
            <i class="fas fa-fire" style="color:var(--red)"></i> Latest Movies 
            <span class="movie-count" id="movieCount"></span>
        </h2>
        <div class="movie-grid" id="movieGrid">
            <div class="no-movies"><i class="fas fa-spinner fa-spin"></i><h3>Loading movies...</h3></div>
        </div>
    </div>

    <footer>
        <p>© 2025 ONflix - All rights reserved | 🛡️ Secured | 🌍 Watch Anywhere</p>
    </footer>

    <script>
        const API = location.origin;
        const DEVICE_KEY = 'onflix_admin_device_verified';
        let allMovies = [];

        // ==================== Admin Detection ====================
        function checkAdmin() {
            const isVerified = localStorage.getItem('onflix_admin_verified') === 'true';
            const adminBtn = document.getElementById('adminBtn');
            const heroAdminBtn = document.getElementById('heroAdminBtn');
            
            if (isVerified) {
                adminBtn.classList.add('show');
                heroAdminBtn.style.display = 'inline-block';
            } else {
                adminBtn.classList.remove('show');
                heroAdminBtn.style.display = 'none';
            }
        }

        // Verify device once with password
        async function verifyDevice() {
            const verified = localStorage.getItem('onflix_admin_verified');
            if (verified === 'true') return true;
            
            const password = prompt('🔐 Enter admin password to unlock upload features (or Cancel to skip):');
            if (!password) return false;
            
            try {
                const res = await fetch(`${API}/api/verify-device`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('onflix_admin_verified', 'true');
                    localStorage.setItem('admin_password', password);
                    checkAdmin();
                    alert('✅ Device verified! Upload features unlocked.');
                    return true;
                } else {
                    alert('❌ Wrong password!');
                    return false;
                }
            } catch(e) {
                alert('❌ Server error! Try again later.');
                return false;
            }
        }
        // =========================================================

        async function loadMovies() {
            const grid = document.getElementById('movieGrid');
            const count = document.getElementById('movieCount');
            try {
                const res = await fetch(`${API}/api/movies`);
                allMovies = await res.json();
                
                if (!allMovies.length) {
                    grid.innerHTML = `<div class="no-movies"><i class="fas fa-film"></i><h3>No Movies Yet!</h3><p>Be the first to upload a movie!</p></div>`;
                    count.textContent = '';
                    return;
                }
                
                count.textContent = `(${allMovies.length} movies)`;
                grid.innerHTML = allMovies.map(m => `
                    <div class="movie-card" onclick="location.href='/watch/${m.id}'">
                        <img class="movie-poster" src="${m.posterUrl || 'https://via.placeholder.com/220x330/1a1a2e/e50914?text=No+Poster'}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/220x330/1a1a2e/e50914?text=No+Poster'">
                        <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-meta">
                                <span>📅 ${m.year}</span>
                                <span class="movie-views">👁 ${m.views || 0} views</span>
                            </div>
                            <span class="movie-genre">${m.genre}</span>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                grid.innerHTML = `<div class="no-movies"><i class="fas fa-exclamation-triangle"></i><h3>Error loading movies</h3><p>Please try again later.</p></div>`;
                count.textContent = '';
            }
        }

        async function searchMovies() {
            const q = document.getElementById('s').value.trim();
            const grid = document.getElementById('movieGrid');
            const count = document.getElementById('movieCount');
            
            if (!q) {
                await loadMovies();
                return;
            }
            
            try {
                const res = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
                const movies = await res.json();
                
                if (!movies.length) {
                    grid.innerHTML = `<div class="no-movies"><i class="fas fa-search"></i><h3>No results found for "${q}"</h3><p>Try different keywords or browse all movies.</p></div>`;
                    count.textContent = '';
                } else {
                    count.textContent = `(${movies.length} results)`;
                    grid.innerHTML = movies.map(m => `
                        <div class="movie-card" onclick="location.href='/watch/${m.id}'">
                            <img class="movie-poster" src="${m.posterUrl || 'https://via.placeholder.com/220x330/1a1a2e/e50914?text=No+Poster'}" alt="${m.title}" onerror="this.src='https://via.placeholder.com/220x330/1a1a2e/e50914?text=No+Poster'">
                            <div class="play-icon"><i class="fas fa-play-circle"></i></div>
                            <div class="movie-info">
                                <div class="movie-title">${m.title}</div>
                                <div class="movie-meta">
                                    <span>📅 ${m.year}</span>
                                    <span class="movie-views">👁 ${m.views || 0} views</span>
                                </div>
                                <span class="movie-genre">${m.genre}</span>
                            </div>
                        </div>
                    `).join('');
                }
            } catch(e) {
                grid.innerHTML = `<div class="no-movies"><i class="fas fa-exclamation-triangle"></i><h3>Search failed</h3><p>Please try again.</p></div>`;
                count.textContent = '';
            }
        }

        // Init
        checkAdmin();
        loadMovies();

        // Click logo to try admin verification
        document.querySelector('.logo').addEventListener('click', function(e) {
            e.preventDefault();
            if (localStorage.getItem('onflix_admin_verified') !== 'true') {
                verifyDevice();
            } else {
                alert('✅ You already have admin access!');
            }
        });
    </script>
</body>
</html>
