<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="R-idmykRomJXEJS349CsX5q5nr-xPvKCJN91nqb5z7E" />
    <title>ONflix - Watch Movies & TV Shows Online Free</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a24;--red:#e50914;--gold:#f5c518;--text:#fff;--text2:#aaa;--border:#222;--sidebar-w:220px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
        
        /* SIDEBAR */
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);padding:20px 0;z-index:999;overflow-y:auto;transition:0.3s}
        .sidebar .logo{font-size:1.8rem;font-weight:900;color:var(--red);text-align:center;margin-bottom:25px;letter-spacing:-1px;padding:0 15px}
        .sidebar .menu{list-style:none}
        .sidebar .menu li a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text2);text-decoration:none;font-size:14px;transition:0.3s;font-weight:500;cursor:pointer}
        .sidebar .menu li a:hover,.sidebar .menu li a.active{color:var(--text);background:rgba(229,9,20,0.15);border-right:3px solid var(--red)}
        .sidebar .menu li a i{width:20px;text-align:center;font-size:16px}
        
        /* MAIN */
        .main{margin-left:var(--sidebar-w);flex:1;min-height:100vh}
        
        /* TOP BAR */
        .topbar{position:sticky;top:0;z-index:100;padding:12px 25px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
        .search-container{position:relative;flex:1;max-width:400px}
        .search-box{display:flex;align-items:center;background:rgba(255,255,255,0.08);border-radius:30px;padding:6px 6px 6px 18px;border:1px solid var(--border)}
        .search-box input{background:none;border:none;color:#fff;padding:10px;outline:none;flex:1;font-size:14px}
        .search-box button{background:var(--red);border:none;color:#fff;padding:10px 20px;border-radius:25px;cursor:pointer;font-weight:600}
        .search-suggestions{position:absolute;top:100%;left:0;right:0;background:var(--bg3);border:1px solid var(--border);border-radius:10px;max-height:300px;overflow-y:auto;z-index:999;margin-top:5px;display:none}
        .suggestion-item{padding:10px 15px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:0.2s;font-size:13px}
        .suggestion-item:hover{background:rgba(229,9,20,0.15)}
        .suggestion-item img{width:30px;height:45px;object-fit:cover;border-radius:4px}
        .suggestion-item .s-title{font-weight:600;color:#fff;flex:1}
        .suggestion-item .s-year{color:var(--text2);font-size:11px}
        .topbar-right{display:flex;align-items:center;gap:15px}
        .btn-sm{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:0.3s}
        .btn-red{background:var(--red);color:#fff}.btn-outline{background:transparent;color:#fff;border:1px solid #555}
        
        /* HERO */
        .hero-slider{position:relative;height:400px;overflow:hidden;margin-bottom:25px;background:var(--bg2)}
        .hero-slide{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:40px;transition:0.8s;opacity:0}
        .hero-slide.active{opacity:1}
        .hero-slide::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(0deg,#0a0a0f 5%,transparent 70%)}
        .hero-info{position:relative;z-index:2;max-width:500px}
        .hero-info h2{font-size:2.2rem;font-weight:900;margin-bottom:8px}
        .hero-info .meta{color:var(--gold);font-size:13px;margin-bottom:8px}
        .hero-info p{color:var(--text2);font-size:14px;margin-bottom:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .hero-btns{display:flex;gap:10px}
        .hero-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:22px;padding:10px 16px;cursor:pointer;border-radius:50%}
        .hero-nav.prev{left:15px}.hero-nav.next{right:15px}
        
        .section{padding:0 25px 30px}
        .section-title{font-size:1.4rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
        .section-title i{color:var(--red)}
        .movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
        .movie-card{background:var(--bg3);border-radius:10px;overflow:hidden;cursor:pointer;transition:0.3s;position:relative;border:1px solid transparent}
        .movie-card:hover{border-color:var(--red);transform:translateY(-6px);box-shadow:0 15px 30px rgba(229,9,20,0.2)}
        .movie-poster{width:100%;height:230px;object-fit:cover;background:var(--bg2)}
        .movie-info{padding:12px}
        .movie-title{font-weight:600;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .movie-meta{font-size:11px;color:var(--gold);margin-bottom:4px}
        .movie-genre{display:inline-block;background:var(--red);color:#fff;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
        .play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:45px;color:#fff;opacity:0;transition:0.3s}
        .movie-card:hover .play-overlay{opacity:1}
        .empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text2)}
        .empty-state i{font-size:60px;color:var(--red);margin-bottom:15px;display:block}
        .empty-state h3{font-size:1.3rem;margin-bottom:8px;color:var(--text)}
        .empty-state p{font-size:14px}
        .no-movies{grid-column:1/-1;text-align:center;padding:60px;color:var(--text2)}
        footer{text-align:center;padding:20px;color:#555;font-size:12px;border-top:1px solid var(--border);margin-top:30px}
        
        @media(max-width:768px){
            .sidebar{left:-100%}.sidebar.open{left:0}
            .main{margin-left:0}
            .hero-slider{height:280px}
            .hero-info h2{font-size:1.4rem}
            .movie-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
            .movie-poster{height:180px}
            .search-container{max-width:100%}
        }
    </style>
</head>
<body>

    <aside class="sidebar" id="sidebar">
        <div class="logo">ONflix</div>
        <ul class="menu">
            <li><a class="active" onclick="filterMovies('all', this)"><i class="fas fa-home"></i> Home</a></li>
            <li><a onclick="filterMovies('Action', this)"><i class="fas fa-film"></i> Action</a></li>
            <li><a onclick="filterMovies('Comedy', this)"><i class="fas fa-laugh"></i> Comedy</a></li>
            <li><a onclick="filterMovies('Drama', this)"><i class="fas fa-theater-masks"></i> Drama</a></li>
            <li><a onclick="filterMovies('Horror', this)"><i class="fas fa-ghost"></i> Horror</a></li>
            <li><a onclick="filterMovies('Sci-Fi', this)"><i class="fas fa-rocket"></i> Sci-Fi</a></li>
            <li><a onclick="filterMovies('Pakistani Drama', this)"><i class="fas fa-tv"></i> Pakistani Drama</a></li>
            <li><a onclick="filterMovies('Turkish Drama', this)"><i class="fas fa-globe"></i> Turkish Drama</a></li>
        </ul>
    </aside>

    <div class="main">
        <div class="topbar">
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="s" placeholder="Search movies..." oninput="liveSearch()" onkeypress="if(event.key==='Enter')searchMovies()">
                    <button onclick="searchMovies()"><i class="fas fa-search"></i></button>
                </div>
                <div class="search-suggestions" id="searchSuggestions"></div>
            </div>
            <div class="topbar-right">
                <span id="userName" style="font-size:13px;color:#ccc;"></span>
                <a href="#" class="btn-sm btn-outline" id="logoutBtn" onclick="logout()" style="display:none;">Logout</a>
                <a href="/login" class="btn-sm btn-red" id="loginBtn">Sign In</a>
                <a href="/admin" class="btn-sm btn-outline" id="adminBtn" style="display:none;">+ Upload</a>
            </div>
        </div>

        <div class="hero-slider" id="heroSlider">
            <div class="hero-slide active" style="background:linear-gradient(135deg,#1a0a0a,#0a0a1a);display:flex;align-items:center;justify-content:center;">
                <div class="hero-info" style="text-align:center;">
                    <h2>Welcome to ONflix</h2>
                    <p>Watch unlimited movies & dramas anytime, anywhere. Free forever!</p>
                    <div class="hero-btns" style="justify-content:center;">
                        <button class="btn-sm btn-red" onclick="document.getElementById('movieGrid').scrollIntoView({behavior:'smooth'})"><i class="fas fa-play"></i> Browse Movies</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title"><i class="fas fa-fire"></i> <span id="sectionLabel">All Movies</span></h2>
            <div class="movie-grid" id="movieGrid">
                <div class="no-movies"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
            </div>
        </div>

        <footer>© 2025 ONflix - Pakistan | Made with ❤️</footer>
    </div>

    <script>
        const API = location.origin;
        let allMovies = [];
        const token = localStorage.getItem('onflix_token');
        const user = JSON.parse(localStorage.getItem('onflix_user') || '{}');
        let currentFilter = 'all';
        let searchTimeout;

        if (!token) {
            document.getElementById('loginBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
        } else {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('userName').textContent = '👤 ' + (user.name || 'User');
            document.getElementById('adminBtn').style.display = 'inline-block';
        }

        function logout() { localStorage.clear(); window.location.href = '/login'; }

        const origFetch = fetch;
        fetch = function(url, options = {}) {
            if (token) { options.headers = options.headers || {}; options.headers['Authorization'] = 'Bearer ' + token; }
            return origFetch(url, options);
        };

        // ==================== LIVE SEARCH ====================
        async function liveSearch() {
            clearTimeout(searchTimeout);
            const q = document.getElementById('s').value.trim();
            const sug = document.getElementById('searchSuggestions');
            
            if (!q || q.length < 1) {
                sug.style.display = 'none';
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                try {
                    const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
                    const movies = await r.json();
                    
                    if (!movies.length) {
                        sug.innerHTML = '<div class="suggestion-item" style="color:#888;cursor:default">No movies found</div>';
                        sug.style.display = 'block';
                        return;
                    }
                    
                    sug.innerHTML = movies.slice(0, 6).map(m => `
                        <div class="suggestion-item" onclick="location.href='/watch/${m.id}'">
                            <img src="${m.posterUrl || 'https://via.placeholder.com/30x45/1a1a2e/e50914'}" onerror="this.src='https://via.placeholder.com/30x45/1a1a2e/e50914'">
                            <span class="s-title">${m.title}</span>
                            <span class="s-year">${m.year}</span>
                        </div>
                    `).join('');
                    sug.style.display = 'block';
                } catch(e) {}
            }, 300);
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchSuggestions').style.display = 'none';
            }
        });
        // ====================================================

        function movieCard(m) {
            const p = m.posterUrl || 'https://via.placeholder.com/180x260/1a1a2e/e50914?text=ONflix';
            const link = m.youtubeLink ? `window.open('${m.youtubeLink}')` : `location.href='/watch/${m.id}'`;
            return `<div class="movie-card" onclick="${link}" style="position:relative">
                <img class="movie-poster" src="${p}" alt="${m.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/180x260/1a1a2e/e50914?text=ONflix'">
                <div class="play-overlay"><i class="fas fa-play-circle"></i></div>
                <div class="movie-info"><div class="movie-title">${m.title}</div><div class="movie-meta">📅 ${m.year} | 👁 ${m.views||0}</div><span class="movie-genre">${m.genre}</span></div></div>`;
        }

        async function loadMovies(filter = 'all') {
            const grid = document.getElementById('movieGrid');
            const label = document.getElementById('sectionLabel');
            
            if (!token) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-lock"></i><h3>Please Sign In</h3><p><a href="/login" style="color:var(--red)">Login</a> to watch movies</p></div>';
                return;
            }

            try {
                const url = filter === 'all' ? `${API}/api/movies` : `${API}/api/movies?genre=${encodeURIComponent(filter)}`;
                const r = await fetch(url);
                const movies = await r.json();
                
                label.textContent = filter === 'all' ? 'All Movies' : filter;
                
                if (!movies.length) {
                    grid.innerHTML = `<div class="empty-state">
                        <i class="fas fa-film"></i>
                        <h3>No Movies Found</h3>
                        <p>${filter === 'all' ? 'Be the first to upload a movie!' : `No ${filter} movies yet. Check back later!`}</p>
                    </div>`;
                    return;
                }
                
                grid.innerHTML = movies.map(movieCard).join('');
                
                if (movies.length > 0) {
                    updateHero(movies.slice(0, 5));
                }
            } catch(e) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Error Loading</h3><p>Please try again</p></div>';
            }
        }

        function filterMovies(genre, element) {
            currentFilter = genre;
            document.querySelectorAll('.sidebar .menu li a').forEach(a => a.classList.remove('active'));
            if (element) element.classList.add('active');
            loadMovies(genre);
        }

        function updateHero(movies) {
            const slider = document.getElementById('heroSlider');
            if (!movies.length) return;
            slider.innerHTML = movies.map((m, i) => {
                const bg = m.posterUrl ? `url(${m.posterUrl})` : 'linear-gradient(135deg,#1a0a0a,#0a0a1a)';
                return `<div class="hero-slide ${i===0?'active':''}" style="background-image:${bg}">
                    <div class="hero-info"><h2>${m.title}</h2><div class="meta">⭐ ${m.rating||'N/A'} | 📅 ${m.year} | 🎭 ${m.genre}</div><p>${m.description||''}</p>
                    <div class="hero-btns"><button class="btn-sm btn-red" onclick="location.href='/watch/${m.id}'"><i class="fas fa-play"></i> Watch Now</button></div></div></div>`;
            }).join('');
            slider.innerHTML += `<button class="hero-nav prev" onclick="changeSlide(-1)"><i class="fas fa-chevron-left"></i></button>
                <button class="hero-nav next" onclick="changeSlide(1)"><i class="fas fa-chevron-right"></i></button>`;
        }

        let currentSlide = 0;
        function changeSlide(dir) {
            const slides = document.querySelectorAll('.hero-slide');
            if (!slides.length) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + dir + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        async function searchMovies() {
            const q = document.getElementById('s').value.trim();
            const grid = document.getElementById('movieGrid');
            const label = document.getElementById('sectionLabel');
            document.getElementById('searchSuggestions').style.display = 'none';
            
            if (!q) { loadMovies(currentFilter); return; }
            
            try {
                const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
                const movies = await r.json();
                label.textContent = `Search: "${q}"`;
                
                if (!movies.length) {
                    grid.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3>No Results</h3><p>No movies found for "${q}"</p></div>`;
                } else {
                    grid.innerHTML = movies.map(movieCard).join('');
                }
            } catch(e) {}
        }

        loadMovies();
    </script>
</body>
</html>
