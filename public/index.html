<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="R-idmykRomJXEJS349CsX5q5nr-xPvKCJN91nqb5z7E" />
    <title>ONflix - Watch Movies & TV Shows Online Free</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a24;--red:#e50914;--gold:#f5c518;--text:#fff;--text2:#aaa;--border:#222;--sidebar-w:220px}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
        
        /* SIDEBAR */
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);padding:20px 0;z-index:999;overflow-y:auto;transition:0.3s}
        .sidebar .logo{font-size:1.8rem;font-weight:900;color:var(--red);text-align:center;margin-bottom:25px;letter-spacing:-1px;padding:0 15px}
        .sidebar .menu{list-style:none}
        .sidebar .menu li a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text2);text-decoration:none;font-size:14px;transition:0.3s;font-weight:500}
        .sidebar .menu li a:hover,.sidebar .menu li a.active{color:var(--text);background:rgba(229,9,20,0.15);border-right:3px solid var(--red)}
        .sidebar .menu li a i{width:20px;text-align:center;font-size:16px}
        
        /* MAIN */
        .main{margin-left:var(--sidebar-w);flex:1;min-height:100vh}
        
        /* TOP BAR */
        .topbar{position:sticky;top:0;z-index:100;padding:12px 25px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
        .search-box{display:flex;align-items:center;background:rgba(255,255,255,0.08);border-radius:30px;padding:6px 6px 6px 18px;border:1px solid var(--border);width:350px}
        .search-box input{background:none;border:none;color:#fff;padding:10px;outline:none;flex:1;font-size:14px}
        .search-box button{background:var(--red);border:none;color:#fff;padding:10px 20px;border-radius:25px;cursor:pointer;font-weight:600}
        .topbar-right{display:flex;align-items:center;gap:15px}
        .btn-sm{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:0.3s}
        .btn-red{background:var(--red);color:#fff}.btn-outline{background:transparent;color:#fff;border:1px solid #555}
        
        /* HERO SLIDER */
        .hero-slider{position:relative;height:450px;overflow:hidden;margin-bottom:30px}
        .hero-slide{position:absolute;top:0;left:0;right:0;bottom:0;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:40px;transition:0.8s;opacity:0}
        .hero-slide.active{opacity:1}
        .hero-slide::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(0deg,#0a0a0f 5%,transparent 70%)}
        .hero-info{position:relative;z-index:2;max-width:500px}
        .hero-info h2{font-size:2.5rem;font-weight:900;margin-bottom:8px}
        .hero-info .meta{color:var(--gold);font-size:13px;margin-bottom:8px}
        .hero-info p{color:var(--text2);font-size:14px;margin-bottom:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .hero-btns{display:flex;gap:10px}
        .hero-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;background:rgba(0,0,0,0.6);border:none;color:#fff;font-size:24px;padding:12px 18px;cursor:pointer;border-radius:50%}
        .hero-nav.prev{left:20px}.hero-nav.next{right:20px}
        
        /* SECTIONS */
        .section{padding:0 25px 30px}
        .section-title{font-size:1.4rem;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:10px}
        .section-title i{color:var(--red)}
        
        /* MOVIE GRID */
        .movie-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
        .movie-card{background:var(--bg3);border-radius:10px;overflow:hidden;cursor:pointer;transition:0.3s;position:relative;border:1px solid transparent}
        .movie-card:hover{border-color:var(--red);transform:translateY(-6px);box-shadow:0 15px 30px rgba(229,9,20,0.2)}
        .movie-poster{width:100%;height:230px;object-fit:cover;background:var(--bg2)}
        .movie-info{padding:12px}
        .movie-title{font-weight:600;font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .movie-meta{font-size:11px;color:var(--gold);margin-bottom:4px}
        .movie-genre{display:inline-block;background:var(--red);color:#fff;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
        .play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:45px;color:#fff;opacity:0;transition:0.3s}
        .movie-card:hover .play-overlay{opacity:1}
        
        .no-movies{grid-column:1/-1;text-align:center;padding:60px;color:var(--text2)}
        
        /* GENRE TAGS */
        .genre-tags{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
        .genre-tag{padding:8px 18px;border-radius:25px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;transition:0.3s;color:var(--text2)}
        .genre-tag:hover,.genre-tag.active{background:var(--red);color:#fff;border-color:var(--red)}
        
        footer{text-align:center;padding:20px;color:#555;font-size:12px;border-top:1px solid var(--border);margin-top:30px}
        
        @media(max-width:768px){
            .sidebar{left:-100%}.sidebar.open{left:0}
            .main{margin-left:0}
            .hero-slider{height:300px}
            .hero-info h2{font-size:1.5rem}
            .movie-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
            .movie-poster{height:180px}
            .search-box{width:200px}
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="logo">ONflix</div>
        <ul class="menu">
            <li><a href="#" class="active" onclick="filterMovies('all')"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="#" onclick="filterMovies('Action')"><i class="fas fa-film"></i> Action</a></li>
            <li><a href="#" onclick="filterMovies('Comedy')"><i class="fas fa-laugh"></i> Comedy</a></li>
            <li><a href="#" onclick="filterMovies('Drama')"><i class="fas fa-theater-masks"></i> Drama</a></li>
            <li><a href="#" onclick="filterMovies('Horror')"><i class="fas fa-ghost"></i> Horror</a></li>
            <li><a href="#" onclick="filterMovies('Sci-Fi')"><i class="fas fa-rocket"></i> Sci-Fi</a></li>
            <li><a href="#" onclick="filterMovies('Pakistani Drama')"><i class="fas fa-tv"></i> Pakistani Drama</a></li>
            <li><a href="#" onclick="filterMovies('Turkish Drama')"><i class="fas fa-globe"></i> Turkish Drama</a></li>
        </ul>
    </aside>

    <!-- MAIN -->
    <div class="main">
        <!-- TOP BAR -->
        <div class="topbar">
            <div class="search-box">
                <input type="text" id="s" placeholder="Search movies..." onkeypress="if(event.key==='Enter')searchMovies()">
                <button onclick="searchMovies()"><i class="fas fa-search"></i></button>
            </div>
            <div class="topbar-right">
                <span id="userName" style="font-size:13px;color:#ccc;"></span>
                <a href="#" class="btn-sm btn-outline" id="logoutBtn" onclick="logout()" style="display:none;">Logout</a>
                <a href="/login" class="btn-sm btn-red" id="loginBtn">Sign In</a>
                <a href="/admin" class="btn-sm btn-outline" id="adminBtn" style="display:none;">+ Upload</a>
            </div>
        </div>

        <!-- HERO SLIDER -->
        <div class="hero-slider" id="heroSlider"></div>

        <!-- GENRE TAGS -->
        <div class="section">
            <div class="genre-tags" id="genreTags">
                <span class="genre-tag active" onclick="filterMovies('all')">All</span>
            </div>
        </div>

        <!-- MOVIES -->
        <div class="section">
            <h2 class="section-title"><i class="fas fa-fire"></i> <span id="sectionLabel">All Movies</span></h2>
            <div class="movie-grid" id="movieGrid"></div>
        </div>

        <footer>© 2025 ONflix - Pakistan | Made with ❤️</footer>
    </div>

    <script>
        const API = location.origin;
        let allMovies = [];
        const token = localStorage.getItem('onflix_token');
        const user = JSON.parse(localStorage.getItem('onflix_user') || '{}');
        let currentFilter = 'all';

        if (!token) { document.getElementById('loginBtn').style.display = 'inline-block'; }
        else {
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            document.getElementById('userName').textContent = '👤 ' + (user.name || 'User');
            document.getElementById('adminBtn').style.display = 'inline-block';
        }

        function logout() { localStorage.clear(); window.location.href = '/login'; }
        const origFetch = fetch;
        fetch = function(url, options = {}) { if (token) { options.headers = options.headers || {}; options.headers['Authorization'] = 'Bearer ' + token; } return origFetch(url, options); };

        function movieCard(m) {
            const p = m.posterUrl || 'https://via.placeholder.com/180x260/1a1a2e/e50914?text=ONflix';
            const link = m.youtubeLink ? `window.open('${m.youtubeLink}')` : `location.href='/watch/${m.id}'`;
            return `<div class="movie-card" onclick="${link}" style="position:relative">
                <img class="movie-poster" src="${p}" alt="${m.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/180x260/1a1a2e/e50914?text=ONflix'">
                <div class="play-overlay"><i class="fas fa-play-circle"></i></div>
                <div class="movie-info"><div class="movie-title">${m.title}</div><div class="movie-meta">📅 ${m.year}</div><span class="movie-genre">${m.genre}</span></div></div>`;
        }

        async function loadMovies(filter = 'all') {
            const g = document.getElementById('movieGrid');
            if (!token) { g.innerHTML = '<div class="no-movies"><i class="fas fa-lock"></i><h3>Please <a href="/login" style="color:var(--red)">Sign In</a></h3></div>'; return; }
            try {
                const r = await fetch(`${API}/api/movies`);
                allMovies = await r.json();
                let filtered = filter === 'all' ? allMovies : allMovies.filter(m => m.genre === filter);
                document.getElementById('sectionLabel').textContent = filter === 'all' ? 'All Movies' : filter;
                if (!filtered.length) { g.innerHTML = '<div class="no-movies"><i class="fas fa-film"></i><h3>No Movies Found</h3></div>'; return; }
                g.innerHTML = filtered.map(movieCard).join('');
                setupHero(filtered.slice(0, 5));
            } catch(e) { g.innerHTML = '<div class="no-movies"><h3>Please login</h3></div>'; }
        }

        function filterMovies(genre) {
            currentFilter = genre;
            document.querySelectorAll('.genre-tag').forEach(t => t.classList.remove('active'));
            event?.target?.classList.add('active');
            loadMovies(genre);
        }

        let heroIndex = 0;
        function setupHero(movies) {
            const slider = document.getElementById('heroSlider');
            if (!movies.length) return;
            slider.innerHTML = movies.map((m, i) => {
                const bg = m.posterUrl || '';
                return `<div class="hero-slide ${i === 0 ? 'active' : ''}" style="background-image:url(${bg})">
                    <div class="hero-info"><h2>${m.title}</h2><div class="meta">⭐ ${m.rating || 'N/A'} | 📅 ${m.year} | 🎭 ${m.genre}</div><p>${m.description || ''}</p>
                    <div class="hero-btns"><button class="btn-sm btn-red" onclick="location.href='/watch/${m.id}'"><i class="fas fa-play"></i> Watch</button></div></div></div>`;
            }).join('');
        }

        async function searchMovies() {
            const q = document.getElementById('s').value.trim();
            if (!q) { loadMovies(currentFilter); return; }
            const g = document.getElementById('movieGrid');
            try {
                const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}`);
                const m = await r.json();
                g.innerHTML = m.length ? m.map(movieCard).join('') : '<div class="no-movies"><i class="fas fa-search"></i><h3>No results</h3></div>';
            } catch(e) {}
        }

        loadMovies();
    </script>
</body>
</html>
