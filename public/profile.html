<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - My Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a24;--red:#e50914;--gold:#f5c518;--text:#fff;--text2:#aaa;--border:#222}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .top-nav{position:sticky;top:0;z-index:100;padding:15px 25px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.95);border-bottom:1px solid var(--border)}
        .back-btn{color:#fff;text-decoration:none;font-size:15px;font-weight:600}.back-btn:hover{color:var(--red)}
        .logo{font-size:1.6rem;font-weight:900;color:var(--red)}
        .container{max-width:700px;margin:0 auto;padding:30px 20px}
        .profile-header{display:flex;align-items:center;gap:25px;margin-bottom:35px;background:var(--bg2);padding:30px;border-radius:15px;border:1px solid var(--border)}
        .avatar-large{width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--red);background:var(--bg3);font-size:40px;display:flex;align-items:center;justify-content:center;color:var(--red)}
        .profile-info h1{font-size:1.8rem;font-weight:700;margin-bottom:5px}
        .profile-info p{color:var(--text2);font-size:14px;margin-bottom:3px}
        .badge{display:inline-block;background:var(--red);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-top:5px}
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:35px}
        .stat-box{background:var(--bg2);padding:20px;border-radius:12px;text-align:center;border:1px solid var(--border)}
        .stat-box i{font-size:28px;color:var(--red);margin-bottom:8px;display:block}
        .stat-box .value{font-size:1.6rem;font-weight:700}.stat-box .label{color:var(--text2);font-size:11px}
        .section{margin-bottom:30px}.section-title{font-size:1.2rem;font-weight:700;margin-bottom:15px}
        .settings-form{background:var(--bg2);padding:25px;border-radius:12px;border:1px solid var(--border)}
        .form-group{margin-bottom:16px}label{display:block;margin-bottom:5px;font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase}
        input{width:100%;padding:13px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}
        input:focus{border-color:var(--red)}.btn-save{background:var(--red);color:#fff;padding:12px 25px;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}.btn-save:hover{background:#ff0f1f}
        .msg{padding:12px;border-radius:8px;margin-top:12px;display:none;font-weight:600;text-align:center}.msg.s{background:#2ecc71}.msg.e{background:#e74c3c}
        .activity-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
        .activity-item i{color:var(--red);width:20px}.activity-item .time{color:var(--text2);font-size:11px;margin-left:auto}
        @media(max-width:768px){.profile-header{flex-direction:column;text-align:center}}
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="logo">ONflix</div>
        <a href="/" class="back-btn"><i class="fas fa-home"></i> Home</a>
    </div>
    <div class="container" id="profileContent">
        <div style="text-align:center;padding:100px;color:var(--text2)">Loading...</div>
    </div>
    <script>
        const API=location.origin;
        const token=localStorage.getItem('onflix_token');
        const user=JSON.parse(localStorage.getItem('onflix_user')||'{}');
        if(!token) location.href='/login';

        async function loadProfile(){
            try{
                const r=await fetch(`${API}/api/me`,{headers:{'Authorization':'Bearer '+token}});
                if(!r.ok) throw new Error('Failed');
                const u=await r.json();
                
                document.getElementById('profileContent').innerHTML=`
                    <div class="profile-header">
                        <div class="avatar-large">${(u.name||'U')[0].toUpperCase()}</div>
                        <div class="profile-info">
                            <h1>${u.name||'User'}</h1>
                            <p><i class="fas fa-envelope"></i> ${u.email}</p>
                            <p><i class="fas fa-calendar"></i> Joined ${new Date(u.createdAt).toLocaleDateString()}</p>
                            <span class="badge">${u.provider==='google'?'🔵 Google':'📧 Email'}</span>
                        </div>
                    </div>
                    <div class="stats-row">
                        <div class="stat-box"><i class="fas fa-film"></i><div class="value">0</div><div class="label">Movies</div></div>
                        <div class="stat-box"><i class="fas fa-eye"></i><div class="value">0</div><div class="label">Views</div></div>
                        <div class="stat-box"><i class="fas fa-shield-alt"></i><div class="value">Active</div><div class="label">Status</div></div>
                    </div>
                    <div class="section">
                        <h2 class="section-title"><i class="fas fa-cog"></i> Settings</h2>
                        <div class="settings-form">
                            <div class="form-group"><label>Display Name</label><input type="text" id="editName" value="${u.name||''}"></div>
                            <div class="form-group"><label>Email</label><input type="email" value="${u.email}" disabled style="opacity:0.6"></div>
                            <button class="btn-save" onclick="saveProfile()"><i class="fas fa-save"></i> Save</button>
                            <div class="msg" id="saveMsg"></div>
                        </div>
                    </div>
                    <div class="section">
                        <h2 class="section-title"><i class="fas fa-history"></i> Info</h2>
                        <div class="activity-item"><i class="fas fa-user"></i> Account <span class="time">${u.provider||'Email'}</span></div>
                        <div class="activity-item"><i class="fas fa-calendar-check"></i> Joined <span class="time">${new Date(u.createdAt).toLocaleDateString()}</span></div>
                    </div>`;
            }catch(e){
                document.getElementById('profileContent').innerHTML='<div style="text-align:center;padding:100px">Error loading profile. <a href="/login" style="color:var(--red)">Login again</a></div>';
            }
        }

        function saveProfile(){
            const n=document.getElementById('editName').value;
            if(!n) return;
            localStorage.setItem('onflix_user',JSON.stringify({...user,name:n}));
            document.getElementById('saveMsg').className='msg s';
            document.getElementById('saveMsg').textContent='✅ Updated!';
            document.getElementById('saveMsg').style.display='block';
        }

        loadProfile();
    </script>
</body>
</html>
