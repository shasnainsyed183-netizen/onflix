<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - My Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a24;--red:#e50914;--gold:#f5c518;--text:#fff;--text2:#aaa;--border:#222}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .top-nav{position:sticky;top:0;z-index:100;padding:15px 25px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
        .back-btn{color:#fff;text-decoration:none;font-size:15px;font-weight:600}
        .back-btn:hover{color:var(--red)}
        .logo{font-size:1.6rem;font-weight:900;color:var(--red)}
        .container{max-width:800px;margin:0 auto;padding:30px 20px}
        
        /* PROFILE HEADER */
        .profile-header{display:flex;align-items:center;gap:25px;margin-bottom:35px;background:var(--bg2);padding:30px;border-radius:15px;border:1px solid var(--border)}
        .avatar-large{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--red);background:var(--bg3)}
        .profile-info h1{font-size:1.8rem;font-weight:700;margin-bottom:5px}
        .profile-info p{color:var(--text2);font-size:14px;margin-bottom:3px}
        .profile-info .badge{display:inline-block;background:var(--red);color:#fff;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-top:5px}
        
        /* STATS */
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:35px}
        .stat-box{background:var(--bg2);padding:20px;border-radius:12px;text-align:center;border:1px solid var(--border)}
        .stat-box i{font-size:28px;color:var(--red);margin-bottom:8px;display:block}
        .stat-box .value{font-size:1.6rem;font-weight:700}
        .stat-box .label{color:var(--text2);font-size:11px;margin-top:4px}
        
        /* SECTIONS */
        .section{margin-bottom:30px}
        .section-title{font-size:1.2rem;font-weight:700;margin-bottom:15px;display:flex;align-items:center;gap:8px}
        .section-title i{color:var(--red)}
        
        /* SETTINGS FORM */
        .settings-form{background:var(--bg2);padding:25px;border-radius:12px;border:1px solid var(--border)}
        .form-group{margin-bottom:16px}
        label{display:block;margin-bottom:5px;font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase}
        input{width:100%;padding:13px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none}
        input:focus{border-color:var(--red)}
        .btn-save{background:var(--red);color:#fff;padding:12px 25px;border:none;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
        .btn-save:hover{background:#ff0f1f}
        .msg{padding:12px;border-radius:8px;margin-top:12px;display:none;font-weight:600;text-align:center}
        .msg.s{background:#2ecc71}.msg.e{background:#e74c3c}
        
        /* ACTIVITY LOG */
        .activity-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
        .activity-item i{color:var(--red);width:20px;text-align:center}
        .activity-item .time{color:var(--text2);font-size:11px;margin-left:auto}
        
        @media(max-width:768px){.profile-header{flex-direction:column;text-align:center}}
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div class="logo">ONflix</div>
        <a href="/" class="back-btn"><i class="fas fa-home"></i> Home</a>
    </div>
    
    <div class="container" id="profileContent">
        <div style="text-align:center;padding:100px;color:var(--text2)">Loading profile...</div>
    </div>

    <script>
        const API=location.origin;
        const token=localStorage.getItem('onflix_token');
        const user=JSON.parse(localStorage.getItem('onflix_user')||'{}');
        
        if(!token){window.location.href='/login';}

        async function loadProfile(){
            try{
                const r=await fetch(`${API}/api/me`,{headers:{'Authorization':'Bearer '+token}});
                const u=await r.json();
                const statsR=await fetch(`${API}/api/movies`,{headers:{'Authorization':'Bearer '+token}});
                const movies=await statsR.json();
                
                const userMovies=movies.filter(m=>m.uploadedBy===u.id);
                const totalWatchTime=movies.reduce((s,m)=>s+(m.views||0),0);

                document.getElementById('profileContent').innerHTML=`
                    <div class="profile-header">
                        <img src="${u.avatar||'https://via.placeholder.com/100'}" class="avatar-large" onerror="this.src='https://via.placeholder.com/100'">
                        <div class="profile-info">
                            <h1>${u.name||'User'}</h1>
                            <p><i class="fas fa-envelope"></i> ${u.email}</p>
                            <p><i class="fas fa-calendar"></i> Joined ${new Date(u.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</p>
                            <p><i class="fas fa-clock"></i> Last login ${new Date(u.lastLogin).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</p>
                            <span class="badge">${u.provider==='google'?'🔵 Google Account':'📧 Email Account'}</span>
                        </div>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat-box"><i class="fas fa-film"></i><div class="value">${userMovies.length}</div><div class="label">My Uploads</div></div>
                        <div class="stat-box"><i class="fas fa-eye"></i><div class="value">${totalWatchTime}</div><div class="label">Total Views</div></div>
                        <div class="stat-box"><i class="fas fa-clock"></i><div class="value">${movies.length}</div><div class="label">Available Movies</div></div>
                    </div>
                    
                    <div class="section">
                        <h2 class="section-title"><i class="fas fa-cog"></i> Account Settings</h2>
                        <div class="settings-form">
                            <div class="form-group"><label>Display Name</label><input type="text" id="editName" value="${u.name||''}"></div>
                            <div class="form-group"><label>Email</label><input type="email" value="${u.email}" disabled style="opacity:0.6"></div>
                            <button class="btn-save" onclick="saveProfile()"><i class="fas fa-save"></i> Save Changes</button>
                            <div class="msg" id="saveMsg"></div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <h2 class="section-title"><i class="fas fa-history"></i> Account Info</h2>
                        <div class="activity-item"><i class="fas fa-user"></i> Account Type <span class="time">${u.provider==='google'?'Google':'Email/Password'}</span></div>
                        <div class="activity-item"><i class="fas fa-shield-alt"></i> Account Status <span class="time" style="color:#2ecc71">Active</span></div>
                        <div class="activity-item"><i class="fas fa-calendar-check"></i> Member Since <span class="time">${new Date(u.createdAt).toLocaleDateString()}</span></div>
                    </div>
                `;
            }catch(e){
                document.getElementById('profileContent').innerHTML='<div style="text-align:center;padding:100px">Error loading profile</div>';
            }
        }

        async function saveProfile(){
            const msg=document.getElementById('saveMsg');
            const newName=document.getElementById('editName').value;
            if(!newName){msg.className='msg e';msg.textContent='❌ Name cannot be empty';msg.style.display='block';return}
            localStorage.setItem('onflix_user',JSON.stringify({...user,name:newName}));
            msg.className='msg s';msg.textContent='✅ Profile updated!';msg.style.display='block';
            setTimeout(()=>location.reload(),1000);
        }

        loadProfile();
    </script>
</body>
</html>
