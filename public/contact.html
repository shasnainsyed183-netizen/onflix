<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - Contact Us</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#000;--bg2:#111;--red:#e50914;--text:#fff;--text2:#b3b3b3;--border:#333}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .header{padding:25px 60px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
        .logo{font-size:2rem;font-weight:900;color:var(--red);text-decoration:none}
        .back-btn{color:var(--text2);text-decoration:none;font-size:14px}.back-btn:hover{color:var(--text)}
        .container{max-width:700px;margin:0 auto;padding:40px 20px}
        .breadcrumb{color:var(--text2);font-size:13px;margin-bottom:25px}
        .breadcrumb a{color:var(--text2);text-decoration:none}.breadcrumb a:hover{color:var(--text)}
        h1{font-size:2rem;margin-bottom:10px}
        .subtitle{color:var(--text2);margin-bottom:30px}
        .form-group{margin-bottom:20px}
        label{display:block;margin-bottom:8px;font-weight:600;font-size:14px}
        input,textarea,select{width:100%;padding:14px;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:#fff;font-size:15px;outline:none;font-family:'Segoe UI',Arial,sans-serif}
        input:focus,textarea:focus,select:focus{border-color:var(--red)}
        textarea{height:150px;resize:vertical}
        select{appearance:none;cursor:pointer}
        .btn{background:var(--red);color:#fff;padding:14px 30px;border:none;border-radius:5px;font-size:16px;font-weight:700;cursor:pointer;transition:0.3s}
        .btn:hover{background:#ff0f1f}
        .msg{padding:15px;border-radius:5px;margin-bottom:20px;display:none;text-align:center;font-weight:600}
        .msg.s{background:#2ecc71}.msg.e{background:#e74c3c}
        .info-section{margin-top:50px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:25px}
        .info-card{background:var(--bg2);padding:25px;border-radius:10px;border:1px solid var(--border);text-align:center}
        .info-card i{font-size:35px;color:var(--red);margin-bottom:12px}
        .info-card h3{font-size:16px;margin-bottom:8px}
        .info-card p{color:var(--text2);font-size:13px}
        .footer{text-align:center;padding:30px;color:var(--text2);font-size:12px;border-top:1px solid var(--border);margin-top:40px}
    </style>
</head>
<body>
    <div class="header">
        <a href="/" class="logo">ONflix</a>
        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
    <div class="container">
        <div class="breadcrumb"><a href="/">Home</a> › <a href="/help">Help Center</a> › Contact Us</div>
        <h1>Contact Us</h1>
        <p class="subtitle">Have a question or need help? Send us a message and we'll get back to you.</p>
        
        <div class="msg" id="msg"></div>
        <form id="contactForm">
            <div class="form-group"><label>Your Name *</label><input type="text" name="name" required placeholder="Enter your name"></div>
            <div class="form-group"><label>Email Address *</label><input type="email" name="email" required placeholder="Enter your email"></div>
            <div class="form-group"><label>Topic *</label><select name="topic" required>
                <option value="">Select a topic</option><option>Account Issues</option><option>Playback Problems</option><option>Billing Question</option><option>Feature Request</option><option>Report a Bug</option><option>Other</option>
            </select></div>
            <div class="form-group"><label>Message *</label><textarea name="message" required placeholder="Describe your issue..."></textarea></div>
            <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Send Message</button>
        </form>
        
        <div class="info-section">
            <div class="info-card"><i class="fas fa-envelope"></i><h3>Email Us</h3><p>support@onflix.com</p></div>
            <div class="info-card"><i class="fas fa-clock"></i><h3>Response Time</h3><p>Within 24 hours</p></div>
            <div class="info-card"><i class="fas fa-comments"></i><h3>Live Chat</h3><p>Available 9AM-6PM</p></div>
        </div>
    </div>
    <div class="footer"><p>© 2025 ONflix. All rights reserved.</p></div>
    <script>
        document.getElementById('contactForm').addEventListener('submit',function(e){
            e.preventDefault();
            const msg=document.getElementById('msg');
            msg.className='msg s';msg.textContent='✅ Message sent successfully! We will get back to you soon.';msg.style.display='block';
            this.reset();
            setTimeout(()=>msg.style.display='none',4000);
        });
    </script>
</body>
</html>
