<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONflix - Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root{--bg:#000;--bg2:#111;--bg3:#1a1a1a;--red:#e50914;--text:#fff;--text2:#b3b3b3;--border:#333}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

        /* TOP BAR */
        .top-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:15px 30px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,0.9),transparent)}
        .back-btn{color:var(--text);text-decoration:none;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px;transition:0.3s}
        .back-btn:hover{color:var(--red)}
        .back-btn i{font-size:20px}
        .top-logo{font-size:1.5rem;font-weight:900;color:var(--red);text-decoration:none;letter-spacing:-1px}

        /* VIDEO CONTAINER */
        .video-container{width:100%;background:#000;display:flex;align-items:center;justify-content:center;min-height:60vh}
        video{width:100%;max-height:80vh;background:#000}
        iframe{width:100%;height:80vh;border:none;background:#000}

        /* MOVIE DETAILS */
        .movie-details{max-width:1000px;margin:0 auto;padding:30px}
        .movie-title{font-size:2.5rem;font-weight:700;margin-bottom:15px;line-height:1.2}
        .movie-meta{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;color:var(--text2);font-size:14px}
        .movie-meta span{display:flex;align-items:center;gap:6px}
        .movie-meta .rating{color:#f5c518;font-weight:700}
        .movie-meta .genre-tag{background:var(--red);color:#fff;padding:4px 14px;border-radius:3px;font-size:12px;font-weight:600}
        
        .action-buttons{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap}
        .btn{padding:12px 24px;border-radius:5px;font-weight:700;font-size:14px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;transition:0.3s;text-decoration:none}
        .btn-play{background:var(--red);color:#fff}
        .btn-play:hover{background:#ff0f1f}
        .btn-outline{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.3)}
        .btn-outline:hover{background:rgba(255,255,255,0.2)}
        
        .movie-description{color:var(--text2);line-height:1.8;font-size:15px;margin-bottom:20px;max-width:700px}
        .movie-extra p{margin-bottom:8px;color:var(--text2);font-size:14px}
        .movie-extra strong{color:var(--text);margin-right:8px}

        .loading{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:15px}
        .loading .spinner{width:50px;height:50px;border:4px solid #333;border-top:4px solid var(--red);border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        .error-page{text-align:center;padding:100px 20px}
        .error-page i{font-size:80px;color:var(--red);margin-bottom:20px}
        .error-page h2{font-size:2rem;margin-bottom:10px}

        @media(max-width:768px){
            .movie-title{font-size:1.8rem}
            .movie-details{padding:20px}
            iframe,video{height:50vh}
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div class="loading" id="loadingScreen">
        <div class="spinner"></div>
        <p style="color:#aaa;">Loading movie...</p>
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display:none;"></div>

    <script>
        const API = location.origin;
        const movieId = location.pathname.split('/watch/')[1];

        async function loadMovie() {
            try {
                const res = await fetch(`${API}/api/movies/${movieId}`);
                const m = await res.json();

                if (m.error) {
                    document.getElementById('loadingScreen').innerHTML = `
                        <div class="error-page">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h2>Movie Not Found</h2>
                            <p style="color:#aaa;">This movie doesn't exist or has been removed.</p>
                            <a href="/" class="btn btn-play" style="margin-top:20px;"><i class="fas fa-home"></i> Back to Home</a>
                        </div>`;
                    return;
                }

                document.title = `${m.title} - ONflix`;

                // Video HTML
                let videoHTML = '';
                if (m.youtubeLink) {
                    let embedUrl = m.youtubeLink;
                    if (embedUrl.includes('youtu.be/')) {
                        embedUrl = `https://www.youtube.com/embed/${embedUrl.split('youtu.be/')[1]?.split('?')[0]}`;
                    } else if (embedUrl.includes('watch?v=')) {
                        embedUrl = `https://www.youtube.com/embed/${embedUrl.split('watch?v=')[1]?.split('&')[0]}`;
                    } else if (embedUrl.includes('/shorts/')) {
                        embedUrl = `https://www.youtube.com/embed/${embedUrl.split('/shorts/')[1]?.split('?')[0]}`;
                    }
                    videoHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
                } else {
                    videoHTML = `<video controls autoplay><source src="${API}/api/stream/${m.id}" type="video/mp4">Your browser doesn't support video playback.</video>`;
                }

                // Build page
                const main = document.getElementById('mainContent');
                main.innerHTML = `
                    <!-- Top Bar -->
                    <div class="top-bar">
                        <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
                        <a href="/" class="top-logo">ONflix</a>
                    </div>

                    <!-- Video -->
                    <div class="video-container">${videoHTML}</div>

                    <!-- Details -->
                    <div class="movie-details">
                        <h1 class="movie-title">${m.title}</h1>
                        
                        <div class="movie-meta">
                            <span class="genre-tag">${m.genre}</span>
                            <span><i class="fas fa-calendar"></i> ${m.year}</span>
                            <span><i class="fas fa-clock"></i> ${m.duration}</span>
                            <span><i class="fas fa-eye"></i> ${m.views || 0} views</span>
                            <span class="rating"><i class="fas fa-star"></i> ${m.rating || 'N/A'}</span>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-play" onclick="window.location.reload()"><i class="fas fa-play"></i> Play</button>
                            <button class="btn btn-outline" onclick="window.history.back()"><i class="fas fa-undo"></i> Go Back</button>
                            <a href="/" class="btn btn-outline"><i class="fas fa-home"></i> Home</a>
                        </div>

                        <p class="movie-description">${m.description || 'No description available.'}</p>

                        <div class="movie-extra">
                            ${m.director ? `<p><strong>🎬 Director:</strong> ${m.director}</p>` : ''}
                            ${m.cast ? `<p><strong>👥 Cast:</strong> ${m.cast}</p>` : ''}
                            <p><strong>📅 Uploaded:</strong> ${new Date(m.uploadDate).toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'})}</p>
                            ${m.filename ? `<p><strong>📁 File:</strong> ${m.filename}</p>` : ''}
                        </div>
                    </div>
                `;

                // Show main content, hide loading
                document.getElementById('loadingScreen').style.display = 'none';
                main.style.display = 'block';

            } catch(e) {
                document.getElementById('loadingScreen').innerHTML = `
                    <div class="error-page">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Something Went Wrong</h2>
                        <p style="color:#aaa;">Please try again later.</p>
                        <a href="/" class="btn btn-play" style="margin-top:20px;"><i class="fas fa-home"></i> Back to Home</a>
                    </div>`;
            }
        }

        loadMovie();
    </script>
</body>
</html>
